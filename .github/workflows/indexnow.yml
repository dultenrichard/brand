# Publication now occurs in the separate root Pages host. Do not announce
# a source-branch push before the public content is actually deployed.
name: Notify IndexNow (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/submit_indexnow.py
