name: Synchronize generated draft pages

on:
  push:
    branches:
      - redesign/editorial-record
    paths:
      - scripts/build_site.py

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'dultenrichard/dultenrichard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild from reviewed content
        run: python scripts/build_site.py
      - name: Commit generated draft HTML and search assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'data/search-index.json' 'data/site-data.js' 'editorial.css'
          if git diff --cached --quiet; then
            echo "Generated pages already current"
            exit 0
          fi
          git commit -m "Sync simplified draft website pages [skip ci]"
          git push origin HEAD:redesign/editorial-record
