name: Browser visual QA

on:
  pull_request:
    branches: [main]
  push:
    branches: ["redesign/**"]

permissions:
  contents: read

jobs:
  screenshot-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          npm run dev > /tmp/site-preview.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site-preview.log
          exit 1
      - name: Test rendered desktop/mobile pages
        run: node tests/browser-smoke.mjs
      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-site-screenshots
          path: artifacts/
          retention-days: 14
