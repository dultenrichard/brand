name: Validate website

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, "redesign/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate local site structure
        run: python scripts/validate_site.py

      - name: Crawl routes, fragments, metadata and assets
        run: python scripts/check_links.py --report /tmp/link-report.json

      - name: Check JavaScript syntax
        run: node --check site.js

      - name: Upload reviewable source
        uses: actions/upload-artifact@v4
        with:
          name: website-review
          path: |
            **/*.html
            *.css
            site.js
            *.png
            *.webp
            data/
            assets/
            robots.txt
            sitemap.xml
          retention-days: 14
