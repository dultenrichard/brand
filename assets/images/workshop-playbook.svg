<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Team movement and decision-making playbook</title>
<desc id="desc">An original overhead coaching diagram with four linked phases, teammates, a common goal, and planned movement routes.</desc>
